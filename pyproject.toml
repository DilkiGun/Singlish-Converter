[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "singlish-studio"
version = "1.0.0"
description = "Modern Real-Time UCSC Singlish to Sinhala Unicode Converter"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
]

[project.gui-scripts]
singlish-studio = "singlish_converter.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
